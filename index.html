<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ORBITA" />
  <meta name="theme-color" content="#080c18" />
  <meta name="screen-orientation" content="portrait" />
  <title>ORBITA — Cosmic Swing-By</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="theme-navy">
  <canvas id="gameCanvas"></canvas>

  <!-- Mode Switcher & Sub-Game Stage Controls (Top-Left Floating Pill) -->
  <div id="modeBar" class="mode-bar">
    <div class="mode-tabs">
      <button id="modeOrbitaBtn" class="mode-tab active" type="button">∞ ORBITA</button>
      <button id="modeMissionBtn" class="mode-tab" type="button">◎ MISSION</button>
    </div>
    <div id="puzzleHudPill" class="puzzle-pill hidden-pill">
      <button id="stageSelectBtn" class="stage-select-btn" type="button">
        <span id="stageSelectLabel">STAGE 01</span>
        <span class="chevron-down">▾</span>
      </button>
      <button id="puzzleRetryBtn" class="stage-icon-btn" type="button" aria-label="Retry Stage" title="リトライ (R)">↻</button>
    </div>
  </div>

  <!-- Sub-Game: 50-Stage Select Modal -->
  <div id="stageSelectOverlay" class="overlay hidden" aria-hidden="true">
    <div class="stage-select-panel">
      <button class="icon-close" id="closeStageSelectBtn" aria-label="Close">×</button>
      <div class="stage-panel-header">MISSION SELECT</div>
      <div class="stage-grid" id="stageGrid"></div>
    </div>
  </div>

  <!-- Sub-Game: Stage Clear Modal -->
  <div id="stageClearOverlay" class="overlay hidden" aria-hidden="true">
    <div class="stage-clear-panel">
      <div class="stage-clear-title" id="stageClearTitle">STAGE 01 CLEAR</div>
      <div class="stage-clear-stars" id="stageClearStars"></div>
      <div class="stage-clear-actions">
        <button id="stageClearRetryBtn" class="clear-retry-btn" type="button" aria-label="Retry">↻</button>
        <button id="stageClearNextBtn" class="clear-next-btn" type="button">NEXT STAGE →</button>
      </div>
    </div>
  </div>

  <!-- Roguelite Upgrade Modal (Cosmic Year End) -->
  <div id="upgradeOverlay" class="overlay hidden" aria-hidden="true">
    <div class="upgrade-panel">
      <div class="year-badge" id="yearDots"></div>
      <div class="upgrade-cards" id="upgradeCards"></div>
    </div>
  </div>

  <!-- Minimal Visual Guide Overlay (Toggled only via '?' icon) -->
  <div id="helpOverlay" class="overlay hidden" aria-hidden="true">
    <div class="help-panel">
      <button class="icon-close" id="closeHelpBtn" aria-label="Close">×</button>
      <div class="help-grid">
        <div class="help-item">
          <svg viewBox="0 0 80 80" class="help-svg">
            <circle cx="46" cy="40" r="10" class="svg-fill" />
            <line x1="46" y1="40" x2="18" y2="56" class="svg-stroke" stroke-dasharray="3 3" />
            <circle cx="18" cy="56" r="4" class="svg-accent-cyan" />
            <path d="M46 40 Q 64 26 70 12" fill="none" class="svg-accent-stroke" stroke-dasharray="3 4" />
          </svg>
          <div class="help-caption">宇宙空間・恒星から引っ張り軌道配置</div>
        </div>
        <div class="help-item">
          <svg viewBox="0 0 80 80" class="help-svg">
            <polygon points="40,30 47,44 33,44" class="svg-accent-cyan" />
            <circle cx="40" cy="39" r="16" fill="none" class="svg-stroke" stroke-dasharray="2 3" />
            <line x1="40" y1="39" x2="20" y2="55" class="svg-stroke" />
          </svg>
          <div class="help-caption">衛星を引っ張り軌道・タイミング調整</div>
        </div>
        <div class="help-item">
          <svg viewBox="0 0 80 80" class="help-svg">
            <polygon points="40,30 47,44 33,44" class="svg-danger" />
            <circle cx="40" cy="39" r="14" fill="none" class="svg-danger-stroke" />
            <circle cx="40" cy="39" r="21" fill="none" class="svg-danger-stroke" opacity="0.5" />
          </svg>
          <div class="help-caption">ダブルタップ / 右クリックで衛星回収</div>
        </div>
        <div class="help-item">
          <svg viewBox="0 0 80 80" class="help-svg">
            <circle cx="24" cy="42" r="6.5" class="svg-fill" />
            <circle cx="56" cy="38" r="6.5" class="svg-fill" />
            <path d="M 12 42 C 12 22, 36 22, 40 40 C 44 58, 68 56, 68 38 C 68 20, 44 22, 40 40 C 36 58, 12 62, 12 42 Z" fill="none" class="svg-accent-stroke" stroke-width="2" stroke-dasharray="3 3" />
            <polygon points="42,35 48,45 36,45" class="svg-accent-cyan" />
          </svg>
          <div class="help-caption">複数恒星を繋ぐ軌道で共鳴・広域巡回</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Game Over Summary Overlay (Pure Geometric Constellation Summary) -->
  <div id="gameOverOverlay" class="overlay hidden" aria-hidden="true">
    <div class="gameover-panel">
      <div class="gameover-reason" id="gameOverIcon"></div>
      <div class="gameover-stats" id="gameOverStats"></div>
      <button id="restartBtn" class="restart-circle" aria-label="Replay">
        <svg viewBox="0 0 48 48" width="32" height="32">
          <path d="M24 10 A14 14 0 1 1 11.5 18" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" />
          <polygon points="9,10 18,16 9,21" fill="currentColor" />
        </svg>
      </button>
    </div>
  </div>

  <script src="js/audio.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/stages.js"></script>
  <script src="js/puzzle.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
